<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B-9. Maintenance · SAMHWA</title>
<link rel="stylesheet" href="maintenance.css?v=20261008-clean-1"><script src="maintenance.js?v=20261008-clean-1" defer></script>
</head>
<body>
<header><div><a class="home" href="../index.html">SAMHWA / B-9</a><h1>Maintenance</h1></div><nav><a class="button" href="../B-3.%20Spare%20Part/index.html">B-3. Spare Part ↗</a><button id="settings-open">조 편성</button></nav></header>
<main>
<section class="toolbar"><div class="date-nav"><button id="previous" aria-label="이전 날짜">←</button><label>근무 시작일<input id="date" type="date" required></label><button id="next" aria-label="다음 날짜">→</button><button id="today">오늘</button><button id="refresh">새로고침</button></div></section>
<p id="connection" role="status" aria-live="polite">서버 조회 중…</p><p id="error" class="notice danger" role="alert" hidden></p>
<div id="setup-notice" class="notice" hidden>조 편성을 먼저 설정하세요.</div>
<div id="shift-picker" class="shift-picker" role="group" aria-label="모바일 교대 선택"><button id="pick-day" data-pick-shift="day" aria-pressed="true">주간<span>08:00–20:00</span></button><button id="pick-night" data-pick-shift="night" aria-pressed="false">야간<span>20:00–다음 날 08:00</span></button></div>
<section id="rosters" class="rosters" aria-label="담당 인원 및 근태"></section>
<section class="panel"><div class="section-head"><div><h2>활동 기록</h2></div></div><div id="mobile-board" class="mobile-board" aria-label="선택 교대 2시간 활동"></div><div class="scroll desktop-board"><table class="board"><thead><tr><th>교대 / 담당 조</th><th>1구간</th><th>2구간</th><th>3구간</th><th>4구간</th><th>5구간</th><th>6구간</th></tr></thead><tbody id="board"></tbody></table></div></section>
<section class="panel"><div class="section-head"><div><h2>월간 통계</h2></div><div class="stats-controls"><button id="month-previous" aria-label="이전 달">←</button><label>월<input id="stats-month" type="month"></label><button id="month-next" aria-label="다음 달">→</button><button id="stats-load">조회</button></div></div><p id="stats-error" class="notice danger" hidden role="alert"></p><div id="stats"><p class="empty">조회 중…</p></div></section>
</main>
<dialog id="password-dialog"><form id="password-form"><div class="dialog-head"><h2>조 편성 비밀번호</h2><button type="button" data-close="password-dialog" aria-label="닫기">✕</button></div><label>비밀번호<input id="settings-password" type="password" inputmode="numeric" autocomplete="off" required></label><p id="password-error" class="notice danger" hidden></p><div class="dialog-actions"><button type="button" data-close="password-dialog">취소</button><button id="password-submit" class="primary">확인</button></div></form></dialog>
<dialog id="settings"><form id="settings-form"><div class="dialog-head"><div><h2>조 편성</h2></div><button type="button" data-close="settings" aria-label="닫기">✕</button></div>
<div class="form-grid"><label>A조 주간 시작 기준일<input id="anchor" type="date" required></label><fieldset><legend>A조 · 2명</legend><label>담당자 1<input id="a1" maxlength="80" required></label><label>담당자 2<input id="a2" maxlength="80" required></label></fieldset><fieldset><legend>B조 · 2명</legend><label>담당자 1<input id="b1" maxlength="80" required></label><label>담당자 2<input id="b2" maxlength="80" required></label></fieldset></div>
<p id="settings-error" class="notice danger" hidden></p><div class="dialog-actions"><button type="button" data-close="settings">취소</button><button id="settings-save" class="primary">편성 저장</button></div><details><summary>편성 이력</summary><div id="settings-history"></div></details></form></dialog>
<dialog id="attendance"><form id="attendance-form"><div class="dialog-head"><h2 id="attendance-title">근태 등록</h2><button type="button" data-close="attendance" aria-label="닫기">✕</button></div><div id="attendance-fields"></div><p id="attendance-error" class="notice danger" hidden></p><div class="dialog-actions"><button type="button" data-close="attendance">취소</button><button id="attendance-save" class="primary">근태 저장</button></div></form></dialog>
<dialog id="activity"><div class="dialog-head"><div><h2 id="activity-title">활동 기록</h2><p id="activity-context"></p></div><button type="button" data-close="activity" aria-label="닫기">✕</button></div><div id="activity-list"></div><form id="activity-form"><div class="section-head compact"><h3 id="activity-mode">새 활동 등록</h3><button type="button" id="activity-new">＋ 새 기록</button></div>
<label>활동 설명<textarea id="description" rows="3" maxlength="2000" required placeholder="활동 내용"></textarea></label>
<label>사진<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="existing-photos" class="photo-grid"></div><div id="photo-preview" class="photo-grid"></div>
<p id="activity-error" class="notice danger" hidden></p><div class="dialog-actions"><button type="button" data-close="activity">닫기</button><button id="activity-save" class="primary">활동 저장</button></div></form></dialog>
</body></html>
